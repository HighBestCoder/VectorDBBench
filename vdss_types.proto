// ============================================================================
// VDSS Common Types - vdss_types.proto
// ============================================================================
//
// Data types mapping VDE C API to Protocol Buffers
// Based on vde.h C API definitions
//
// ============================================================================

syntax = "proto3";

package vdss;

// Vector data
message Vector {
    repeated float data = 1;     // Vector values
    uint32 dimension = 2;        // Vector dimension
}

// Payload (metadata in JSON format, matching VDEPayload)
message Payload {
    string json = 1;             // Payload in JSON format
}

message HnswConfig {
    uint32 m = 1;                // Number of edges per node in the index graph
    uint32 ef_construct = 2;     // Number of neighbours to consider during index building
    uint32 ef_search = 3;        // Number of neighbours to consider during search
}

enum IndexAlgorithm {
    HNSW = 0;
}

enum IndexDriver {
    FAISS = 0;
}

enum StorageType {
    ZENDB = 0;
    MEM = 1;  // In-memory storage (for testing)
}

enum DistanceMetric {
    COSINE = 0;
    EUCLIDEAN = 1;
    DOT = 2;
}

// Collection configuration (matching VDECollectionConfig)
message CollectionConfig {
    IndexDriver index_driver = 1;        // Currently only "FAISS" is supported.
    IndexAlgorithm index_algorithm = 2;  // Currently only "HNSW" is supported.
    StorageType storage_type = 3;        // "ZENDB" or "MEM" (memory-only for testing)
    uint32 dimension = 4;                // Vector dimension
    DistanceMetric distance_metric = 5;  // One of { "COSINE", "EUCLIDEAN", "DOT" }
    string config_json = 6;              // Driver-specific config (JSON format)
    optional HnswConfig hnsw_config = 7; // HNSW specific configuration
}

// Search result (matching VDESearchResult)
message SearchResult {
    uint64 offset = 1;           // PointOffset (internal ID)
    float score = 2;             // Similarity score
}

// Collection state (matching VDECollectionState)
enum CollectionState {
    READY = 0;
    REBUILDING = 1;
    ERROR = 2;
}

// Collection statistics (matching VDECollectionStats)
message CollectionStats {
    uint64 total_vectors = 1;
    uint64 indexed_vectors = 2;
    uint64 deleted_vectors = 3;
    uint64 storage_bytes = 4;
    uint64 index_memory_bytes = 5;
}

// Status response
message Status {
    int32 code = 1;              // 0 = success, negative = error
    string message = 2;          // Error message if code != 0
}

